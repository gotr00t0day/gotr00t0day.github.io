<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - gotr00t</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        .welcome-container {
            text-align: center;
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 26px;
        }

        .kicker {
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-faint);
        }
        .kicker .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
            margin-right: 8px;
            vertical-align: middle;
            animation: caret 2s ease-in-out infinite;
        }

        .hero-title {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: clamp(2.6rem, 9vw, 4.6rem);
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
        }

        .subtitle {
            font-size: clamp(1.05rem, 3vw, 1.6rem);
            letter-spacing: 3px;
            color: var(--text-dim);
        }
        .subtitle .accent { color: var(--accent); }

        .video-container {
            width: 100%;
            max-width: 600px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        video {
            width: 100%;
            height: auto;
            max-height: 55vh;
            display: block;
            object-fit: contain;
        }

        .enter-btn {
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 3px;
            padding: 16px 52px;
        }
    </style>
</head>

<body>
    <div class="welcome-container">
        <p class="kicker"><span class="dot"></span>System online</p>
        <h1 class="hero-title">gotr00t</h1>
        <p class="subtitle">Hacking from the <span class="accent">Shadows</span></p>

        <div class="video-container">
            <video id="welcomeVideo" autoplay muted loop playsinline preload="auto">
                <source src="videos/grok-gotroot.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <a href="main.html" class="enter-btn btn-accent">
            <i class="fas fa-terminal"></i>
            ENTER
        </a>
    </div>

    <script>
        const video = document.getElementById('welcomeVideo');
        video.play().catch(function () {
            document.addEventListener('touchstart', function () { video.play(); }, { once: true });
        });
    </script>
</body>
</html>
