<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gotr00t — Enter the Shadows</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/theme.css">
    <style>
        html, body { height: 100%; }
        body {
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Focused glow behind the portrait, on top of theme's grid + vignette */
        .stage::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(60% 45% at 50% 34%, rgba(57, 255, 20, 0.12), transparent 60%);
            pointer-events: none;
        }

        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 48px 16px;
            text-align: center;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-size: 0.72rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--text-dim);
        }
        .status .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            animation: blink 1.8s ease-in-out infinite;
        }

        /* ---- portrait ---- */
        .portrait {
            position: relative;
            width: min(300px, 64vw);
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            animation: float 6s ease-in-out infinite;
        }
        .halo {
            position: absolute;
            width: 82%; aspect-ratio: 1; border-radius: 50%;
            background: radial-gradient(circle, rgba(57, 255, 20, 0.20), transparent 70%);
            filter: blur(8px);
        }
        .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px dashed var(--accent-dim);
            animation: spin 26s linear infinite;
        }
        .ring.inner {
            inset: 12px;
            border-style: solid;
            border-color: rgba(57, 255, 20, 0.16);
            animation-duration: 18s;
            animation-direction: reverse;
        }
        .frame {
            position: absolute;
            inset: 26px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid rgba(57, 255, 20, 0.30);
            box-shadow: 0 0 60px rgba(57, 255, 20, 0.18), inset 0 0 40px rgba(0, 0, 0, 0.6);
        }
        .frame img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            filter: contrast(1.05) saturate(0.9);
        }
        /* subtle scanline + green wash so the photo reads as "from the shadows" */
        .frame::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(57, 255, 20, 0.06), rgba(5, 6, 7, 0.35)),
                repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px);
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        /* ---- wordmark ---- */
        .wordmark {
            position: relative;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: clamp(2.8rem, 13vw, 6rem);
            letter-spacing: 6px;
            line-height: 1;
            color: #fff;
            margin: 4px 0 0;
            text-shadow: 0 0 34px rgba(255, 255, 255, 0.16);
        }
        .wordmark::before, .wordmark::after {
            content: attr(data-text);
            position: absolute;
            inset: 0;
        }
        .wordmark::before { color: var(--accent); opacity: 0; mix-blend-mode: screen; animation: glitchA 5s infinite steps(1); }
        .wordmark::after  { color: #fff;         opacity: 0; mix-blend-mode: screen; animation: glitchB 5s infinite steps(1); }

        .subtitle {
            font-size: clamp(1rem, 3.4vw, 1.5rem);
            letter-spacing: 4px;
            color: var(--text-dim);
            margin: 0;
        }
        .subtitle b { color: var(--accent-soft); font-weight: 400; }
        .byline {
            font-size: 0.72rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-faint);
            margin: 0;
        }

        .enter {
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 4px;
            color: #dfffce;
            text-decoration: none;
            padding: 15px 44px;
            border-radius: 11px;
            border: 1px solid var(--accent-dim);
            background: rgba(57, 255, 20, 0.07);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }
        .enter:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            background: rgba(57, 255, 20, 0.14);
            box-shadow: 0 0 0 1px rgba(57, 255, 20, 0.25), 0 14px 40px rgba(0, 0, 0, 0.6), 0 0 40px rgba(57, 255, 20, 0.25);
            color: #fff;
        }
        .enter .chev { color: var(--accent); font-weight: 900; }

        @keyframes float { 0%, 100% { transform: translateY(-6px); } 50% { transform: translateY(6px); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
        @keyframes glitchA { 0%, 92%, 100% { opacity: 0; clip-path: inset(0 0 0 0); } 93% { opacity: 0.8; clip-path: inset(12% 0 60% 0); transform: translate(-3px, 0); } 96% { opacity: 0.8; clip-path: inset(70% 0 8% 0); transform: translate(2px, 0); } }
        @keyframes glitchB { 0%, 92%, 100% { opacity: 0; } 94% { opacity: 0.7; clip-path: inset(40% 0 35% 0); transform: translate(3px, 0); } 97% { opacity: 0.7; clip-path: inset(5% 0 80% 0); transform: translate(-2px, 0); } }

        @media (prefers-reduced-motion: reduce) {
            .portrait, .ring, .status .dot, .wordmark::before, .wordmark::after { animation: none !important; }
        }
    </style>
</head>

<body>
    <main class="stage">
        <p class="status"><span class="dot"></span>root@gotr00t — session active</p>

        <div class="portrait">
            <div class="halo"></div>
            <div class="ring"></div>
            <div class="ring inner"></div>
            <div class="frame">
                <img src="Images/wolf-green.jpg" alt="gotr00t">
            </div>
        </div>

        <h1 class="wordmark" data-text="gotr00t">gotr00t</h1>
        <p class="subtitle">Hacking from the <b>Shadows</b></p>
        <p class="byline">c0d3ninja · security research</p>

        <a class="enter" href="main.html"><span class="chev">❯</span> ENTER</a>
    </main>
</body>
</html>
